apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: ModuleType
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/moduletype
  labels:
    testing.upbound.io/example-name: e2e
  name: e2e
  namespace: default
spec:
  forProvider:
    model: e2e-ns-module-model
    partNumber: E2E-NS-1
    description: created by uptest
    manufacturerIdRef:
      name: e2e-module
    profileIdRef:
      name: e2e-module
    # Validated by NetBox against the profile's schema.
    attributes: '{"cores": 8, "architecture": "x86_64"}'
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---

apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: ModuleTypeProfile
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/moduletype
  labels:
    testing.upbound.io/example-name: e2e-module
  name: e2e-module
  namespace: default
spec:
  forProvider:
    name: e2e-ns-module-profile
    description: created by uptest
    # A JSON schema for the attributes of the module types using this profile.
    schema: '{"properties": {"cores": {"type": "integer"}, "architecture": {"type": "string"}}}'
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

---

apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: Manufacturer
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/moduletype
  labels:
    testing.upbound.io/example-name: e2e-module
  name: e2e-module
  namespace: default
spec:
  forProvider:
    name: e2e-ns-module-manufacturer
    slug: e2e-ns-module-manufacturer
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default

