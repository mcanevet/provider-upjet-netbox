apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: ModuleType
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/moduletype
  labels:
    testing.upbound.io/example-name: e2e
  name: e2e
spec:
  forProvider:
    model: e2e-cluster-module-model
    partNumber: E2E-CLUSTER-1
    description: created by uptest
    manufacturerIdRef:
      name: e2e-module
    profileIdRef:
      name: e2e-module
    # Validated by NetBox against the profile's schema.
    attributes: '{"cores": 8, "architecture": "x86_64"}'

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: ModuleTypeProfile
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/moduletype
  labels:
    testing.upbound.io/example-name: e2e-module
  name: e2e-module
spec:
  forProvider:
    name: e2e-cluster-module-profile
    description: created by uptest
    # A JSON schema for the attributes of the module types using this profile.
    schema: '{"properties": {"cores": {"type": "integer"}, "architecture": {"type": "string"}}}'

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Manufacturer
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/moduletype
  labels:
    testing.upbound.io/example-name: e2e-module
  name: e2e-module
spec:
  forProvider:
    name: e2e-cluster-module-manufacturer
    slug: e2e-cluster-module-manufacturer

---

# A bay on the module type, e.g. for a module nested in it.
apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: ModuleBayTemplate
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/moduletype
  labels:
    testing.upbound.io/example-name: e2e-module
  name: e2e-module
spec:
  forProvider:
    name: bay0
    position: "0"
    description: created by uptest
    moduleTypeIdRef:
      name: e2e
