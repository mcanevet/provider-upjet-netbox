apiVersion: virtualization.netbox.crossplane.io/v1alpha1
kind: VirtualMachine
metadata:
  annotations:
    meta.upbound.io/example-id: virtualization/v1alpha1/virtualmachine
  labels:
    testing.upbound.io/example-name: e2e
  name: e2e
spec:
  forProvider:
    name: e2e-cluster-vm
    status: active
    description: created by uptest
    # NetBox requires a virtual machine to be assigned to a site and/or cluster.
    siteIdRef:
      name: e2e-vm

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Site
metadata:
  annotations:
    meta.upbound.io/example-id: virtualization/v1alpha1/virtualmachine
  labels:
    testing.upbound.io/example-name: e2e-vm
  name: e2e-vm
spec:
  forProvider:
    name: e2e-cluster-vm-site
    slug: e2e-cluster-vm-site
    status: active
