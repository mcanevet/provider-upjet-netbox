        subCategory: Tenancy
        description: 'A NetBox contact (tenancy.contact). From the official documentation https://docs.netbox.dev/en/stable/features/contacts/#contacts_1: A contact should represent an individual or permanent point of contact. Each contact must define a name, and may optionally include a title, phone number, email address, and related details.Contacts are reused for assignments, so each unique contact must be created only once and can be assigned to any number of NetBox objects, and there is no limit to the number of assigned contacts an object may have. Most core objects in NetBox can have contacts assigned to them.'
        name: netbox_contact
        title: netbox_contact Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "address": "test-address",
                  "description": "test-description",
                  "email": "test-contact@example.com",
                  "group_ids": [
                    "${netbox_contact_group.test.id}"
                  ],
                  "link": "https://example.com/test-contact",
                  "name": "test-contact",
                  "phone": "+1 555 0100",
                  "title": "test-title"
                }
              references:
                group_ids: netbox_contact_group.test.id
              dependencies:
                netbox_contact_group.test: |-
                    {
                      "name": "test-contact-group"
                    }
        argumentDocs:
            address: (String)
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            email: (String) Email address.
            group_ids: (Set of Number) Ids of contact groups this contact belongs to.
            id: (Number) NetBox id.
            last_updated: (String)
            link: (String) URL related to the contact.
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            phone: (String)
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            title: (String)
            url: (String)
        importStatements:
            - terraform import netbox_contact.test 123
    netbox_contact_assignment:
        subCategory: Tenancy
        description: 'A NetBox contact assignment (tenancy.contactassignment): a contact attached to an object in a role. From the official documentation https://docs.netbox.dev/en/stable/features/contacts#contactassignments_1: Much like tenancy, contact assignment enables you to track ownership of resources modeled in NetBox.'
        name: netbox_contact_assignment
        title: netbox_contact_assignment Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "contact_id": "${netbox_contact.test.id}",
                  "object_id": "${netbox_site.test.id}",
                  "object_type": "dcim.site",
                  "priority": "primary",
                  "role_id": "${netbox_contact_role.test.id}"
                }
              references:
                contact_id: netbox_contact.test.id
                object_id: netbox_site.test.id
                role_id: netbox_contact_role.test.id
              dependencies:
                netbox_contact.test: |-
                    {
                      "name": "test-contact"
                    }
                netbox_contact_role.test: |-
                    {
                      "name": "test-contact-role"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
        argumentDocs:
            contact_id: (Number) Id of the contact.
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            id: (Number) NetBox id.
            last_updated: (String)
            object_id: (Number) Id of the object the contact is assigned to.
            object_type: (String) Content type of the object the contact is assigned to (dcim.site, dcim.device, tenancy.tenant, ...).
            priority: '(String) Priority of the contact for this object. One of: primary, secondary, tertiary, inactive.'
            role_id: '(Number) Id of the contact role. Once set it cannot be removed, only changed: NetBox rejects a null. If you drop it from the config, keep a depends_on on the role so it is destroyed after the assignment.'
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            url: (String)
        importStatements:
            - terraform import netbox_contact_assignment.test 123
    netbox_contact_group:
        subCategory: Tenancy
        description: 'A NetBox contact group (tenancy.contactgroup). From the official documentation https://docs.netbox.dev/en/stable/features/contacts/#contact-groups: Contacts can be grouped arbitrarily into a recursive hierarchy, and a contact can be assigned to a group at any level within the hierarchy.'
        name: netbox_contact_group
