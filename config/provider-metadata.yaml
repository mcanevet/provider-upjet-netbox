            description: (String)
            environment_params: (String) Parameters for the Jinja2 environment as JSON text (use jsonencode()).
            file_extension: (String) Extension appended to the file name, e.g. csv.
            file_name: (String) File name of the rendered output, without extension.
            id: (Number) NetBox id.
            last_updated: (String)
            mime_type: (String) MIME type of the rendered output, e.g. text/csv.
            name: (String)
            object_types: (Set of String) Object types the template can export, as app-labelled content types (dcim.device).
            owner_id: (Number) Id of the owner the object is assigned to.
            template_code: (String) Jinja2 template code; the queryset is available as {{ queryset }}.
            url: (String)
        importStatements:
            - terraform import netbox_export_template.test 123
    netbox_fhrp_group:
        subCategory: IP Address Management (IPAM)
        description: 'A first-hop redundancy protocol group (ipam.fhrpgroup). From the official documentation https://netboxlabs.com/docs/netbox/models/ipam/fhrpgroup/: A first-hop redundancy protocol (FHRP) enables multiple physical interfaces to present a virtual'
        name: netbox_fhrp_group
        title: netbox_fhrp_group Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "auth_key": "test-key",
                  "auth_type": "plaintext",
