        name: netbox_contact_role
        title: netbox_contact_role Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "name": "test-contact-role"
                }
        argumentDocs:
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            id: (Number) NetBox id.
            last_updated: (String)
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            slug: (String) URL-friendly unique shorthand; derived from name when not set.
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            url: (String)
        importStatements:
            - terraform import netbox_contact_role.test 123
    netbox_custom_field:
        subCategory: Extras
        description: 'A NetBox custom field definition (extras.customfield). Values are set per object via the custom_fields attribute. From the official documentation https://docs.netbox.dev/en/stable/customization/custom-fields/#custom-fields: Each model in NetBox is represented in the database as a discrete table, and each attribute of a model exists as a column within its table. For example, sites are stored in the dcim_site table, which has columns named name, facility, physical_address, and so on. As new attributes are added to objects throughout the development of NetBox, tables are expanded to include new rows.However, some users might want to store additional object attributes that are somewhat esoteric in nature, and that would not make sense to include in the core NetBox database schema. For instance, suppose your organization needs to associate each device with a ticket number correlating it with an internal support system record. This is certainly a legitimate use for NetBox, but it''s not a common enough need to warrant including a field for every NetBox installation. Instead, you can create a custom field to hold this data.'
        name: netbox_custom_field
        title: netbox_custom_field Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "default": "${jsonencode(5)}",
                  "description": "test-description",
                  "filter_logic": "exact",
                  "group_name": "test-group",
                  "label": "test-label",
                  "name": "test_custom_field",
                  "object_types": [
                    "dcim.device",
                    "dcim.site"
                  ],
                  "required": false,
                  "type": "integer",
                  "validation_maximum": 100,
                  "validation_minimum": 1,
                  "weight": 100
                }
        argumentDocs:
            choice_set_id: (Number) Id of the choice set (select and multiselect fields).
            comments: (String)
            created: (String)
            default: (String) Default value as JSON text, e.g. jsonencode("foo") or jsonencode(5).
            description: (String)
            filter_logic: '(String) How the field is matched when filtering. One of: disabled, loose, exact.'
            group_name: (String) Custom fields in the same group are shown together.
            id: (Number) NetBox id of the custom field.
            is_cloneable: (Boolean) Whether the value is copied when an object is cloned.
            label: (String) Human-readable label.
            last_updated: (String)
            name: (String) Internal field name (also the key in custom_fields).
            object_types: (Set of String) Object types the field applies to, e.g. dcim.site.
            owner_id: (Number) Id of the owner the object is assigned to.
            related_object_filter: (String) Query parameters that narrow the objects offered for object and multiobject fields, as JSON text, e.g. jsonencode({ status = "active" }).
            related_object_type: (String) Content type of the related objects for object and multiobject fields, e.g. dcim.device.
            required: (Boolean) Whether a value is required when creating objects.
            search_weight: (Number) Weight of the field in the global search; lower values rank higher and 0 leaves the field out. Must be a whole number.
            type: '(String) Field data type. One of: text, longtext, integer, decimal, boolean, date, datetime, url, json, select, multiselect, object, multiobject.'
            ui_editable: '(String) Whether the field value can be edited in the UI. One of: yes, no, hidden.'
            ui_visible: '(String) Whether the field is displayed in the UI. One of: always, if-set, hidden.'
            unique: (Boolean) Whether the value must be unique among the objects the field is assigned to.
            url: (String)
            validation_maximum: (Number) Maximum allowed value (numeric fields).
            validation_minimum: (Number) Minimum allowed value (numeric fields).
            validation_regex: (String) Regular expression text values must match.
            validation_schema: (String) JSON schema that values of a json field must match, as JSON text (use jsonencode()).
            weight: (Number) Order within a group. Must be a whole number.
        importStatements:
            - terraform import netbox_custom_field.test 123
    netbox_custom_field_choice_set:
        subCategory: Extras
        description: 'A NetBox custom field choice set (extras.customfieldchoiceset). From the official documentation https://docs.netbox.dev/en/stable/models/extras/customfieldchoiceset/: Single- and multi-selection custom fields must define a set of valid choices from which the user may choose when defining the field value. These choices are defined as sets that may be reused among multiple custom fields. A choice set must define a base choice set and/or a set of arbitrary extra choices.'
        name: netbox_custom_field_choice_set
        title: netbox_custom_field_choice_set Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "extra_choices": [
                    {
                      "label": "test-a",
                      "value": "a"
                    },
                    {
                      "label": "test-b",
                      "value": "b"
                    }
                  ],
                  "name": "test-custom-field-choice-set"
                }
        argumentDocs:
            base_choices: '(String) Predefined set of choices to start from. One of: IATA, ISO_3166, UN_LOCODE.'
            choice_colors: (Map of String) Colors of choices, by choice value. One of blue, indigo, purple, pink, red, orange, yellow, green, teal, cyan, gray, black or white each.
            choices_count: (Number)
            created: (String)
            description: (String)
            extra_choices: (Attributes List) Additional choices as value/label pairs. (see below for nested schema)
            id: (Number) NetBox id of the choice set.
            label: (String)
            last_updated: (String)
            name: (String)
            order_alphabetically: (Boolean) Sort choices alphabetically instead of by definition order.
            owner_id: (Number) Id of the owner the object is assigned to.
            url: (String)
            value: (String)
        importStatements:
            - terraform import netbox_custom_field_choice_set.test 123
    netbox_custom_link:
        subCategory: Extras
        description: 'A custom link rendered on the pages of the object types it applies to (extras.customlink). From the official documentation https://netboxlabs.com/docs/netbox/models/extras/customlink/: Users can add custom links to object views in NetBox to reference external resources. For example, you might create a custom link for devices pointing to a monitoring system. See the'
        name: netbox_custom_link
        title: netbox_custom_link Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "button_class": "blue",
                  "enabled": true,
                  "group_name": "test-group",
                  "link_text": "Open {{ object.name }}",
                  "link_url": "https://example.com/test/{{ object.pk }}",
                  "name": "test-custom-link",
                  "new_window": true,
                  "object_types": [
                    "dcim.device",
                    "dcim.site"
                  ],
                  "weight": 100
                }
        argumentDocs:
            button_class: '(String) Button style. One of: default, blue, indigo, purple, pink, red, orange, yellow, green, teal, cyan, gray, black, white, ghost-dark.'
            created: (String)
            enabled: (Boolean) Whether the link is rendered.
            group_name: (String) Links with the same group name are rendered as a dropdown.
            id: (Number) NetBox id.
            last_updated: (String)
            link_text: (String) Jinja2 template for the link text; the object is available as {{ object }}.
            link_url: (String) Jinja2 template for the link URL; the object is available as {{ object }}.
            name: (String)
            new_window: (Boolean) Open the link in a new browser window.
            object_types: (Set of String) Object types the link is shown on, as app-labelled content types (dcim.device).
            owner_id: (Number) Id of the owner the object is assigned to.
            url: (String)
            weight: (Number) Order within the group. Must be a whole number.
        importStatements:
            - terraform import netbox_custom_link.test 123
    netbox_data_source:
        subCategory: Extras
        description: 'A NetBox data source (core.datasource): a git repository, S3 bucket or local path NetBox synchronises files from. From the official documentation https://netboxlabs.com/docs/netbox/models/core/datasource/: A data source represents some external repository of data which NetBox can consume, such as a git repository. Files within the data source are synchronized to NetBox by saving them in the database as'
        name: netbox_data_source
        title: netbox_data_source Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "enabled": true,
                  "ignore_rules": "*.md",
                  "name": "test-data-source",
                  "parameters": "${jsonencode({ branch = \"main\" })}",
                  "source_url": "https://example.com/test.git",
                  "sync_interval": 1440,
                  "type": "git"
                }
        argumentDocs:
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            enabled: (Boolean) Whether NetBox synchronises from this source.
            file_count: (Number) Number of files synced from the data source.
            id: (Number) NetBox id.
            ignore_rules: (String) Newline-separated glob patterns of files to ignore when synchronising.
            last_synced: (String) When NetBox last synchronised the source.
            last_updated: (String)
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            parameters: (String) Backend-specific parameters as JSON text (use jsonencode()).
            source_url: (String) URL or path of the source.
            status: (String) Synchronisation status reported by NetBox.
            sync_interval: '(Number) Automatic synchronisation interval in minutes. One of: 1, 60, 720, 1440, 10080, 43200.'
            type: '(String) Kind of backing store. One of: local, git, amazon-s3.'
            url: (String)
        importStatements:
            - terraform import netbox_data_source.test 123
    netbox_device:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A physical device (dcim.device). primary_ip4_id/primary_ip6_id are set through netbox_primary_ip. From the official documentation https://netboxlabs.com/docs/netbox/models/dcim/device/: Every piece of hardware which is installed within a site or rack exists in NetBox as a device. Devices are measured in rack units (U) and can be half depth or full depth. A device may have a height of 0U: These devices do not consume vertical rack space and cannot be assigned to a particular rack unit. A common example of a 0U device is a vertically-mounted PDU.'
        name: netbox_device
        title: netbox_device Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "airflow": "front-to-rear",
                  "asset_tag": "test-asset-tag",
                  "description": "test-description",
                  "device_type_id": "${netbox_device_type.test.id}",
                  "local_context_data": "${jsonencode({ ntp = [\"192.0.2.1\"] })}",
                  "location_id": "${netbox_location.test.id}",
                  "name": "test-device",
