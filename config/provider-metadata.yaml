    netbox_cable:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A cable between two sets of terminations (dcim.cable): interfaces, front and rear ports, console and power ports, power feeds or circuit terminations. From the official documentation https://docs.netbox.dev/en/stable/models/dcim/cable/: All connections between device components in NetBox are represented using cables. A cable represents a direct physical connection between two sets of endpoints (A and B), such as a console port and a patch panel port, or between two network interfaces.'
        name: netbox_cable
        title: netbox_cable Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "a_side": {
                    "device_interface_ids": [
                      "${netbox_device_interface.test_a.id}"
                    ]
                  },
                  "b_side": {
                    "device_interface_ids": [
                      "${netbox_device_interface.test_b.id}"
                    ]
                  },
                  "color_hex": "ff0000",
                  "description": "test-description",
                  "label": "test-label",
                  "length": 3,
                  "length_unit": "m",
                  "status": "connected",
                  "type": "cat6"
                }
              dependencies:
                netbox_device.test_a: |-
                    {
                      "device_type_id": "${netbox_device_type.test.id}",
                      "name": "test-device-a",
                      "role_id": "${netbox_device_role.test.id}",
                      "site_id": "${netbox_site.test.id}"
                    }
                netbox_device.test_b: |-
                    {
                      "device_type_id": "${netbox_device_type.test.id}",
                      "name": "test-device-b",
                      "role_id": "${netbox_device_role.test.id}",
                      "site_id": "${netbox_site.test.id}"
                    }
                netbox_device_interface.test_a: |-
                    {
                      "device_id": "${netbox_device.test_a.id}",
                      "name": "test-interface",
                      "type": "1000base-t"
                    }
                netbox_device_interface.test_b: |-
                    {
                      "device_id": "${netbox_device.test_b.id}",
                      "name": "test-interface",
                      "type": "1000base-t"
                    }
                netbox_device_role.test: |-
                    {
                      "name": "test-device-role"
                    }
                netbox_device_type.test: |-
                    {
                      "manufacturer_id": "${netbox_manufacturer.test.id}",
                      "model": "test-device-type"
                    }
                netbox_manufacturer.test: |-
                    {
                      "name": "test-manufacturer"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
        argumentDocs:
            a_side: '(Attributes) What the A side terminates on: objects of one type (NetBox''s rule), one or several for a breakout, in order (with a profile the position is the connector). Give object_type and ids, or exactly one of the typed *_ids lists, which is an alias of the same thing. (see below for nested schema)'
            b_side: '(Attributes) What the B side terminates on: objects of one type (NetBox''s rule), one or several for a breakout, in order (with a profile the position is the connector). Give object_type and ids, or exactly one of the typed *_ids lists, which is an alias of the same thing. (see below for nested schema)'
            bundle_id: (Number) Id of the cable bundle.
            circuit_termination_ids: (List of Number) Ids of the circuit terminations this side terminates on (object_type circuits.circuittermination). Conflicts with the other *_ids lists and with object_type/ids.
            color_hex: (String) RGB color in hex (e.g. ff0000).
            comments: (String)
            console_port_ids: (List of Number) Ids of the console ports this side terminates on (object_type dcim.consoleport). Conflicts with the other *_ids lists and with object_type/ids.
            console_server_port_ids: (List of Number) Ids of the console server ports this side terminates on (object_type dcim.consoleserverport). Conflicts with the other *_ids lists and with object_type/ids.
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            device_interface_ids: (List of Number) Ids of the device interfaces this side terminates on (object_type dcim.interface). Conflicts with the other *_ids lists and with object_type/ids.
            front_port_ids: (List of Number) Ids of the front ports this side terminates on (object_type dcim.frontport). Conflicts with the other *_ids lists and with object_type/ids.
            id: (Number) NetBox id.
            ids: (List of Number) Ids of the terminating objects, in order (see object_type).
            label: (String) Physical label.
            last_updated: (String)
            length: (Number) Cable length; requires length_unit.
            length_unit: '(String) Unit of length. One of: km, m, cm, mi, ft, in.'
            object_type: '(String) Content type of the terminating objects. Derived from the *_ids list that is set; set it together with ids otherwise. One of: dcim.interface, dcim.frontport, dcim.rearport, dcim.consoleport, dcim.consoleserverport, dcim.powerport, dcim.poweroutlet, dcim.powerfeed, circuits.circuittermination.'
            owner_id: (Number) Id of the owner the object is assigned to.
            power_feed_ids: (List of Number) Ids of the power feeds this side terminates on (object_type dcim.powerfeed). Conflicts with the other *_ids lists and with object_type/ids.
            power_outlet_ids: (List of Number) Ids of the power outlets this side terminates on (object_type dcim.poweroutlet). Conflicts with the other *_ids lists and with object_type/ids.
            power_port_ids: (List of Number) Ids of the power ports this side terminates on (object_type dcim.powerport). Conflicts with the other *_ids lists and with object_type/ids.
            profile: '(String) Cable profile (connectors and positions per side); with one set, each termination''s position in the list is its connector. NetBox rejects clearing it, so unset keeps the current value. One of: single-1c1p, single-1c2p, single-1c4p, single-1c6p, single-1c8p, single-1c12p, single-1c16p, trunk-2c1p, trunk-2c2p, trunk-2c4p, trunk-2c4p-shuffle, trunk-2c6p, trunk-2c8p, trunk-2c12p, trunk-4c1p, trunk-4c2p, trunk-4c4p, trunk-4c4p-shuffle, trunk-4c6p, trunk-4c8p, trunk-8c4p, breakout-1c2p-2c1p, breakout-1c4p-4c1p, breakout-1c6p-6c1p, breakout-1c8p-8c1p, breakout-2c4p-8c1p-shuffle.'
            rear_port_ids: (List of Number) Ids of the rear ports this side terminates on (object_type dcim.rearport). Conflicts with the other *_ids lists and with object_type/ids.
            status: '(String) Cable status. One of: connected, planned, decommissioning.'
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            tenant_id: (Number) Id of the tenant.
            type: (String) Cable type as its NetBox slug, e.g. cat6, smf-os2, power (any of NetBox's cable type choices).
            url: (String)
        importStatements:
            - terraform import netbox_cable.test 123
