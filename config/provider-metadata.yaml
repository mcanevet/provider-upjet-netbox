            description: (String)
            id: (Number) NetBox id.
            last_updated: (String)
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            rack_count: (Number) Number of racks in the rack group.
            slug: (String) URL-friendly unique shorthand; derived from name when not set.
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            url: (String)
        importStatements:
            - terraform import netbox_rack_group.test 123
    netbox_rack_reservation:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A reservation of rack units (dcim.rackreservation). From the official documentation https://docs.netbox.dev/en/stable/models/dcim/rackreservation/: Users can reserve specific units within a rack for future use. An arbitrary set of units within a rack can be associated with a single reservation, but reservations cannot span multiple racks. A description is required for each reservation, reservations may optionally be associated with a specific tenant.'
