                      "name": "test-power-panel",
                      "site_id": "${netbox_site.test.id}"
                    }
                netbox_rack.test: |-
                    {
                      "name": "test-rack",
                      "site_id": "${netbox_site.test.id}"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
        argumentDocs:
