    netbox_device_power_outlet:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A device power outlet (dcim.poweroutlet). From the official documentation https://docs.netbox.dev/en/stable/models/dcim/poweroutlet/: Power outlets represent the outlets on a power distribution unit (PDU) or other device that supplies power to dependent devices. Each power port may be assigned a physical type, and may be associated with a specific feed leg (where three-phase power is used) and/or a specific upstream power port. This association can be used to model the distribution of power within a device. For example, imagine a PDU with one power port which draws from a three-phase feed and 48 power outlets arranged into three banks of 16 outlets each. Outlets 1-16 would be associated with leg A on the port, and outlets 17-32 and 33-48 would be associated with legs B and C, respectively.'
        name: netbox_device_power_outlet
        title: netbox_device_power_outlet Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "device_id": "${netbox_device.test.id}",
                  "feed_leg": "A",
                  "label": "test-label",
                  "name": "test-power-outlet",
                  "power_port_id": "${netbox_device_power_port.test.id}",
                  "type": "iec-60320-c13"
                }
              references:
                device_id: netbox_device.test.id
                power_port_id: netbox_device_power_port.test.id
              dependencies:
                netbox_device.test: |-
                    {
                      "device_type_id": "${netbox_device_type.test.id}",
                      "name": "test-device",
                      "role_id": "${netbox_device_role.test.id}",
                      "site_id": "${netbox_site.test.id}"
                    }
                netbox_device_power_port.test: |-
                    {
                      "device_id": "${netbox_device.test.id}",
                      "name": "test-power-port",
                      "type": "iec-60320-c14"
                    }
                netbox_device_role.test: |-
                    {
                      "name": "test-device-role"
                    }
                netbox_device_type.test: |-
                    {
                      "manufacturer_id": "${netbox_manufacturer.test.id}",
                      "model": "test-device-type"
                    }
                netbox_manufacturer.test: |-
                    {
                      "name": "test-manufacturer"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
        argumentDocs:
            color_hex: (String) RGB color in hex (e.g. ff0000).
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            device_id: (Number) Id of the device.
            feed_leg: '(String) Phase (for three-phase feeds). One of: A, B, C.'
            id: (Number) NetBox id.
            label: (String) Physical label.
            last_updated: (String)
            mark_connected: (Boolean) Treat as if a cable is connected.
            module_id: (Number) Id of the installed module this component belongs to.
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            power_port_id: (Number) Id of the upstream power port on the same device.
            status: '(String) Operational status. One of: enabled, disabled, faulty.'
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            type: (String) Outlet type as its NetBox slug, e.g. iec-60320-c13, nema-5-15r (any of NetBox's power outlet type choices).
            url: (String)
        importStatements:
            - terraform import netbox_device_power_outlet.test 123
    netbox_device_power_port:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A device power port (dcim.powerport). From the official documentation https://docs.netbox.dev/en/stable/models/dcim/powerport/: A power port is a device component which draws power from some external source (e.g. an upstream power outlet), and generally represents a power supply internal to a device.'
