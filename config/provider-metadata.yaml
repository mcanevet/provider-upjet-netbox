    netbox_device_tag:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'Attaches a single tag to a device, like aws_ec2_tag in the AWS provider: use it to tag a device that is created and managed outside of Terraform (onboarding automation, the NetBox UI) without taking ownership of the rest of the device. A netbox_device resource for the same device fights this resource — its updates strip every tag its own configuration does not declare — unless it sets lifecycle { ignore_changes = [tags] }. Import as /.'
        name: netbox_device_tag
        title: netbox_device_tag Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "device_id": "${netbox_device.test.id}",
                  "tag_slug": "${netbox_tag.test.slug}"
                }
              references:
                device_id: netbox_device.test.id
                tag_slug: netbox_tag.test.slug
              dependencies:
                netbox_device.test: |-
                    {
                      "device_type_id": "${netbox_device_type.test.id}",
                      "lifecycle": [
                        {
                          "ignore_changes": [
                            "${tags}"
                          ]
                        }
                      ],
                      "name": "test-device",
                      "role_id": "${netbox_device_role.test.id}",
                      "site_id": "${netbox_site.test.id}"
                    }
                netbox_device_role.test: |-
                    {
                      "name": "test-device-role"
                    }
                netbox_device_type.test: |-
                    {
                      "manufacturer_id": "${netbox_manufacturer.test.id}",
                      "model": "test-device-type"
                    }
                netbox_manufacturer.test: |-
                    {
                      "name": "test-manufacturer"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
                netbox_tag.test: |-
                    {
                      "name": "test-tag"
                    }
        argumentDocs:
            device_id: (Number) Id of the device.
            id: (String) /.
            tag_slug: (String) Slug of the tag. The tag must already exist.
        importStatements:
            - |-
              # <device id>/<tag slug>
              terraform import netbox_device_tag.test 123/test-tag
    netbox_device_type:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A device type (dcim.devicetype): a hardware model made by a manufacturer. From the official documentation https://netboxlabs.com/docs/netbox/models/dcim/devicetype/: A device type represents a particular make and model of hardware that exists in the real world. Device types define the physical attributes of a device (rack height and depth) and its individual components (console, power, network interfaces, and so on).'
        name: netbox_device_type
        title: netbox_device_type Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "airflow": "front-to-rear",
                  "description": "test-description",
                  "is_full_depth": false,
                  "manufacturer_id": "${netbox_manufacturer.test.id}",
                  "model": "test-device-type",
                  "part_number": "test-part-number",
                  "slug": "test-device-type",
                  "u_height": 1,
                  "weight": 12.5,
                  "weight_unit": "kg"
                }
              references:
                manufacturer_id: netbox_manufacturer.test.id
              dependencies:
                netbox_manufacturer.test: |-
                    {
                      "name": "test-manufacturer"
                    }
        argumentDocs:
            airflow: '(String) Airflow direction. One of: front-to-rear, rear-to-front, left-to-right, right-to-left, side-to-rear, passive, mixed, rear-to-side, bottom-to-top, top-to-bottom.'
            comments: (String)
            console_port_template_count: (Number) Number of console port templates of the device type.
            console_server_port_template_count: (Number) Number of console server port templates of the device type.
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            default_platform_id: (Number) Id of the platform assigned to new devices of this type.
            description: (String)
            device_bay_template_count: (Number) Number of device bay templates of the device type.
            device_count: (Number) Number of devices of the device type.
            exclude_from_utilization: (Boolean) Whether devices of this type are left out of the rack utilization.
            front_port_template_count: (Number) Number of front port templates of the device type.
            id: (Number) NetBox id.
            interface_template_count: (Number) Number of interface templates of the device type.
            inventory_item_template_count: (Number) Number of inventory item templates of the device type.
            is_full_depth: (Boolean) Device consumes both the front and rear rack faces.
            last_updated: (String)
            manufacturer_id: (Number) Id of the manufacturer.
            model: (String) Model name (unique per manufacturer).
            module_bay_template_count: (Number) Number of module bay templates of the device type.
            owner_id: (Number) Id of the owner the object is assigned to.
            part_number: (String) Discrete part number.
            power_outlet_template_count: (Number) Number of power outlet templates of the device type.
            power_port_template_count: (Number) Number of power port templates of the device type.
            rear_port_template_count: (Number) Number of rear port templates of the device type.
            slug: (String) URL-friendly unique shorthand; derived from model when not set.
            subdevice_role: '(String) Parent devices house child devices in device bays. One of: parent, child.'
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            u_height: (Number) Height in rack units (0.5 steps).
            url: (String)
            weight: (Number) Weight of the device type (requires weight_unit).
            weight_unit: '(String) Unit of weight. One of: kg, g, lb, oz.'
        importStatements:
            - terraform import netbox_device_type.test 123
    netbox_event_rule:
        subCategory: Extras
        description: 'A NetBox event rule (extras.eventrule): runs a webhook or a script when objects of the given types change. From the official documentation https://docs.netbox.dev/en/stable/features/event-rules/: NetBox can be configured via Event Rules to transmit outgoing webhooks to remote systems in response to internal object changes. The receiver can act on the data in these webhook messages to perform related tasks. Event rules can also execute custom scripts, enabling NetBox to run defined logic locally in response to object changes.'
        name: netbox_event_rule
        title: netbox_event_rule Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "action_object_id": "${netbox_webhook.test.id}",
                  "action_object_type": "extras.webhook",
                  "action_type": "webhook",
                  "conditions": "${jsonencode({ attr = \"status\", value = \"active\" })}",
                  "description": "test-description",
                  "enabled": true,
                  "event_types": [
                    "object_created",
                    "object_updated"
                  ],
                  "name": "test-event-rule",
                  "object_types": [
                    "dcim.site",
                    "dcim.device"
                  ]
                }
              references:
                action_object_id: netbox_webhook.test.id
              dependencies:
                netbox_webhook.test: |-
                    {
                      "name": "test-webhook",
                      "payload_url": "https://example.com/test"
                    }
        argumentDocs:
            action_object_id: (Number) Id of the webhook or script to run.
            action_object_type: '(String) Content type of the action object: extras.webhook or extras.script.'
            action_type: '(String) What the rule runs. One of: webhook, script, notification.'
            conditions: (String) Conditions the changed object must satisfy, as JSON text (use jsonencode()).
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            enabled: (Boolean) Whether the rule fires.
            event_types: '(Set of String) Events that trigger the rule: object_created, object_updated, object_deleted, job_started, job_completed, job_failed or job_errored.'
            id: (Number) NetBox id.
            last_updated: (String)
            name: (String)
            object_types: (Set of String) Object types the rule watches, as app-labelled content types (dcim.device).
            owner_id: (Number) Id of the owner the object is assigned to.
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            url: (String)
        importStatements:
            - terraform import netbox_event_rule.test 123
    netbox_export_template:
        subCategory: Extras
        description: 'A Jinja2 export template for the object types it applies to (extras.exporttemplate). From the official documentation https://netboxlabs.com/docs/netbox/models/extras/exporttemplate/: Export templates are used to render arbitrary data from a set of NetBox objects. For example, you might want to automatically generate a network monitoring service configuration from a list of device objects. See the'
