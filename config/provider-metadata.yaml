    netbox_device_rear_port:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A device rear port (dcim.rearport). From the official documentation https://docs.netbox.dev/en/stable/models/dcim/rearport/: Like front ports, rear ports are pass-through ports which represent the continuation of a path from one cable to the next. Each rear port is defined with its physical type and a number of positions: Rear ports with more than one position can be mapped to multiple front ports. This can be useful for modeling instances where multiple paths share a common cable (for example, six discrete two-strand fiber connections sharing a 12-strand MPO cable).'
