    netbox_device_front_port:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A device front port (dcim.frontport): a pass-through port on the front of a patch panel or cassette, mapped position by position onto rear ports of the same device. From the official documentation https://docs.netbox.dev/en/stable/models/dcim/frontport/: Front ports are pass-through ports which represent physical cable connections that comprise part of a longer path. For example, the ports on the front face of a UTP patch panel would be modeled in NetBox as front ports. Each port is assigned a physical type, and must be mapped to a specific rear port on the same device. A single rear port may be mapped to multiple front ports, using numeric positions to annotate the specific alignment of each.'
        name: netbox_device_front_port
        title: netbox_device_front_port Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "color_hex": "ff0000",
                  "description": "test-description",
                  "device_id": "${netbox_device.test.id}",
                  "label": "test-label",
                  "name": "test-front-port",
                  "rear_port_id": "${netbox_device_rear_port.test.id}",
                  "rear_port_position": 2,
                  "type": "8p8c"
                }
              references:
                device_id: netbox_device.test.id
                rear_port_id: netbox_device_rear_port.test.id
              dependencies:
                netbox_device.test: |-
                    {
                      "device_type_id": "${netbox_device_type.test.id}",
                      "name": "test-device",
                      "role_id": "${netbox_device_role.test.id}",
                      "site_id": "${netbox_site.test.id}"
                    }
                netbox_device_rear_port.test: |-
                    {
                      "device_id": "${netbox_device.test.id}",
                      "name": "test-rear-port",
                      "positions": 4,
                      "type": "8p8c"
                    }
                netbox_device_role.test: |-
                    {
                      "name": "test-device-role"
                    }
                netbox_device_type.test: |-
                    {
                      "manufacturer_id": "${netbox_manufacturer.test.id}",
                      "model": "test-device-type"
                    }
                netbox_manufacturer.test: |-
                    {
                      "name": "test-manufacturer"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
        argumentDocs:
            color_hex: (String) RGB color in hex (e.g. ff0000).
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            device_id: (Number) Id of the device.
            id: (Number) NetBox id.
            label: (String) Physical label.
            last_updated: (String)
            mark_connected: (Boolean) Treat as if a cable is connected.
            module_id: (Number) Id of the installed module this component belongs to.
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            position: (Number) Position on the front port, 1-based and unique per port. Must be a whole number.
            positions: (Number) Number of positions on the front port, at least the number of rear_ports mappings. NetBox checks a lower value against the mappings it already holds, so remove mappings in one apply and lower positions in the next. Must be a whole number.
            rear_port_id: '(Number) Rear port of a single-position front port: the same as rear_ports = [{position = 1, rear_port_id = ..., rear_port_position = ...}]. Conflicts with rear_ports and with positions > 1.'
            rear_port_position: (Number) Position on rear_port_id. Requires rear_port_id. Must be a whole number.
            rear_ports: (Attributes Set) Mappings of the front port's positions onto rear ports of the same device, one object per position. Derived from rear_port_id and rear_port_position when those are set; an empty set, or neither form, leaves the port unmapped. Changing the set recreates every mapping, since NetBox 4.6 rejects an update that resends an existing one. (see below for nested schema)
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            type: (String) Port type as its NetBox slug, e.g. 8p8c, lc, mpo (any of NetBox's port type choices).
            url: (String)
        importStatements:
            - terraform import netbox_device_front_port.test 123
