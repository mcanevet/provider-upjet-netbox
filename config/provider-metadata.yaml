    netbox_available_ip_address:
        subCategory: IP Address Management (IPAM)
        description: 'A NetBox IP address (ipam.ipaddress) allocated from the next free address of a prefix or IP range. After creation it is an ordinary IP address; the allocation inputs replace the resource when changed. From the official documentation https://netboxlabs.com/docs/netbox/models/ipam/ipaddress/: An IP address object in NetBox comprises a single host address (either IPv4 or IPv6) and its subnet mask, and represents an IP address as configured on a network interface. IP addresses can be assigned to'
        name: netbox_available_ip_address
        title: netbox_available_ip_address Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "dns_name": "test-host.example.com",
                  "prefix_id": "${netbox_prefix.test.id}",
                  "role": "vip",
                  "status": "reserved",
                  "tenant_id": "${netbox_tenant.test.id}"
                }
              references:
                prefix_id: netbox_prefix.test.id
                tenant_id: netbox_tenant.test.id
              dependencies:
                netbox_prefix.test: |-
                    {
                      "prefix": "192.0.2.0/24",
                      "status": "active"
                    }
                netbox_tenant.test: |-
                    {
                      "name": "test-tenant"
                    }
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "ip_range_id": "${netbox_ip_range.test.id}",
                  "status": "active"
                }
              references:
                ip_range_id: netbox_ip_range.test.id
              dependencies:
                netbox_ip_range.test: |-
                    {
                      "end_address": "192.0.2.200/24",
                      "start_address": "192.0.2.129/24"
                    }
            - name: test
              manifest: |-
                {
                  "device_interface_id": "${netbox_device_interface.test.id}",
                  "dns_name": "test-device.example.com",
                  "prefix_id": "${netbox_prefix.test.id}",
                  "status": "active"
                }
              references:
                device_interface_id: netbox_device_interface.test.id
                prefix_id: netbox_prefix.test.id
              dependencies:
                netbox_device.test: |-
                    {
                      "device_type_id": "${netbox_device_type.test.id}",
                      "name": "test-device",
                      "role_id": "${netbox_device_role.test.id}",
                      "site_id": "${netbox_site.test.id}"
                    }
                netbox_device_interface.test: |-
                    {
                      "device_id": "${netbox_device.test.id}",
                      "name": "eth0",
                      "type": "1000base-t"
                    }
                netbox_device_role.test: |-
                    {
                      "name": "test-device-role"
                    }
                netbox_device_type.test: |-
                    {
                      "manufacturer_id": "${netbox_manufacturer.test.id}",
                      "model": "test-device-type"
                    }
                netbox_manufacturer.test: |-
                    {
                      "name": "test-manufacturer"
                    }
                netbox_prefix.test: |-
                    {
                      "prefix": "192.0.2.0/24",
                      "status": "active"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
        argumentDocs:
            assigned_object: (Attributes) The interface the address is assigned to. device is null for VM interfaces. (see below for nested schema)
            assigned_object_id: (Number) Id of the object the address is assigned to (see assigned_object_type).
            assigned_object_type: '(String) Content type of the object the address is assigned to. Derived from device_interface_id or virtual_machine_interface_id when one of those is set; set it together with assigned_object_id for other object types. One of: dcim.interface, virtualization.vminterface, ipam.fhrpgroup.'
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            device: (Attributes) (see below for nested schema)
            device_interface_id: (Number) Id of the device interface the address is assigned to (assigned_object_type dcim.interface). Conflicts with virtual_machine_interface_id and with setting the assigned_object_* pair directly.
            dns_name: (String) Hostname or FQDN (not case-sensitive).
            family: (Number) IP family (4 or 6).
            id: (Number) NetBox id of the IP address.
            ip_address: (String) The allocated IPv4 or IPv6 address with prefix length (e.g. 10.0.0.1/24).
            ip_range_id: (Number) Id of the IP range to allocate the next available address from. Exactly one of prefix_id and ip_range_id must be set.
            last_updated: (String)
            name: (String)
            nat_inside_id: (Number) Id of the IP address this address is the NAT (outside) IP for.
            owner_id: (Number) Id of the owner the object is assigned to.
            prefix_id: (Number) Id of the prefix to allocate the next available address from. Exactly one of prefix_id and ip_range_id must be set.
            role: '(String) Functional role. One of: loopback, secondary, anycast, vip, vrrp, hsrp, glbp, carp.'
            status: '(String) Operational status. One of: active, reserved, deprecated, dhcp, slaac.'
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            tenant_id: (Number) Id of the tenant.
            url: (String)
            virtual_machine_interface_id: (Number) Id of the virtual machine interface the address is assigned to (assigned_object_type virtualization.vminterface). Conflicts with device_interface_id and with setting the assigned_object_* pair directly.
            vrf_id: (Number) Id of the VRF.
        importStatements:
            - terraform import netbox_available_ip_address.test 123
    netbox_available_prefix:
        subCategory: IP Address Management (IPAM)
        description: 'A NetBox prefix (ipam.prefix) allocated as the next free child prefix of the given length inside a parent prefix. After creation it is an ordinary prefix; the allocation inputs replace the resource when changed. Import with "parent_prefix_id/prefix_id/prefix_length". From the official documentation https://netboxlabs.com/docs/netbox/models/ipam/prefix/: A prefix is an IPv4 or IPv6 network and mask expressed in CIDR notation (e.g. 192.0.2.0/24). A prefix entails only the "network portion" of an IP address: All bits in the address not covered by the mask must be zero. (In other words, a prefix cannot be a specific IP address.) Prefixes are automatically organized by their parent'
        name: netbox_available_prefix
        title: netbox_available_prefix Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "parent_prefix_id": "${netbox_prefix.test.id}",
                  "prefix_length": 26,
                  "status": "active",
                  "tenant_id": "${netbox_tenant.test.id}"
                }
              references:
                parent_prefix_id: netbox_prefix.test.id
                tenant_id: netbox_tenant.test.id
              dependencies:
                netbox_prefix.test: |-
                    {
                      "prefix": "192.0.2.0/24",
                      "status": "container"
                    }
                netbox_tenant.test: |-
                    {
                      "name": "test-tenant"
                    }
        argumentDocs:
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            id: (Number) NetBox id.
            is_pool: (Boolean) All addresses within this prefix are usable.
            last_updated: (String)
            location_id: (Number) Id of the location the object is scoped to (scope_type dcim.location).
            mark_utilized: (Boolean) Report space as fully utilized.
            owner_id: (Number) Id of the owner the object is assigned to.
            parent_prefix_id: (Number) Id of the prefix to allocate the child prefix from.
            prefix: (String) The allocated IPv4 or IPv6 network with mask, e.g. 10.0.1.0/24.
            prefix_length: (Number) Length of the prefix to allocate (0-128). Must be a whole number.
            region_id: (Number) Id of the region the object is scoped to (scope_type dcim.region).
            role_id: (Number) Id of the role.
            scope_id: (Number) Id of the scope object (see scope_type).
            scope_type: '(String) Content type of the scope. Derived from site_id, location_id, region_id or site_group_id when one of those is set; set it together with scope_id otherwise. One of: dcim.site, dcim.location, dcim.region, dcim.sitegroup.'
            site_group_id: (Number) Id of the site group the object is scoped to (scope_type dcim.sitegroup).
            site_id: (Number) Id of the site the object is scoped to (scope_type dcim.site). Conflicts with the other scope aliases and with setting the scope_* pair directly.
            status: '(String) Operational status. One of: container, active, reserved, deprecated.'
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            tenant_id: (Number) Id of the tenant.
            url: (String)
            vlan_id: (Number) Id of the VLAN.
            vrf_id: (Number) Id of the VRF.
        importStatements:
            - |-
              # parent_prefix_id/prefix_id/prefix_length
              terraform import netbox_available_prefix.test 1/2/24
    netbox_available_vlan:
        subCategory: IP Address Management (IPAM)
        description: 'A NetBox VLAN (ipam.vlan) allocated with the next free VLAN id of a VLAN group. After creation it is an ordinary VLAN; the group replaces the resource when changed. From the official documentation https://netboxlabs.com/docs/netbox/models/ipam/vlan/: A Virtual LAN (VLAN) represents an isolated layer two domain, identified by a name and a numeric ID (1-4094) as defined in'
        name: netbox_available_vlan
        title: netbox_available_vlan Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "group_id": "${netbox_vlan_group.test.id}",
                  "name": "test-vlan",
