    netbox_virtual_device_context:
        subCategory: Data Center Inventory Management (DCIM)
        description: 'A virtual device context: a logical partition of a device with its own interfaces and addresses (dcim.virtualdevicecontext). From the official documentation https://netboxlabs.com/docs/netbox/models/dcim/virtualdevicecontext/: A virtual device context (VDC) represents a logical partition within a physical device, to which interfaces from the parent device can be allocated. Each VDC effectively provides an isolated control plane, but relies on shared resources of the parent device. A VDC is somewhat similar to a virtual machine in that it effects isolation between various components, but stops short of delivering a fully virtualized environment.Each VDC must be assigned to a device upon creation, after which interfaces belonging to that device can be assigned to one or more of its VDCs. A VDC can have any number of interfaces assigned to it, and an interface can belong to any number of VDCs.'
        name: netbox_virtual_device_context
        title: netbox_virtual_device_context Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
