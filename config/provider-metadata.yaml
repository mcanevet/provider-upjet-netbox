            prefix_count: (Number) Number of prefixes in the site group.
            site_count: (Number) Number of sites in the site group.
            slug: (String) URL-friendly unique shorthand; derived from name when not set.
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            url: (String)
        importStatements:
            - terraform import netbox_site_group.test 123
    netbox_tag:
        subCategory: Extras
        description: 'A NetBox tag (extras.tag). go-netbox has no Writable variant for tags. From the official documentation https://docs.netbox.dev/en/stable/models/extras/tag/: Tags are user-defined labels which can be applied to a variety of objects within NetBox. They can be used to establish dimensions of organization beyond the relationships built into NetBox. For example, you might create a tag to identify a particular ownership or condition across several types of objects.Each tag has a label, color, and a URL-friendly slug. For example, the slug for a tag named "Dunder Mifflin, Inc." would be dunder-mifflin-inc. The slug is generated automatically and makes tags easier to work with as URL parameters. Each tag can also be assigned a description indicating its purpose.'
        name: netbox_tag
        title: netbox_tag Resource - terraform-provider-netbox
        examples:
