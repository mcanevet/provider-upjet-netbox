name: netbox
resources:
    netbox_aggregate:
        subCategory: IP Address Management (IPAM)
        description: 'An aggregate (ipam.aggregate): a top-level block a RIR allocated. From the official documentation https://docs.netbox.dev/en/stable/features/ipam/#aggregates: NetBox allows us to specify the portions of IP space that are interesting to us by defining aggregates. Typically, an aggregate will correspond to either an allocation of public (globally routable) IP space granted by a regional authority, or a private (internally-routable) designation.'
        name: netbox_aggregate
        title: netbox_aggregate Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "date_added": "2026-01-15",
                  "description": "test-description",
                  "prefix": "192.0.2.0/24",
                  "rir_id": "${netbox_rir.test.id}",
                  "tenant_id": "${netbox_tenant.test.id}"
                }
              references:
                rir_id: netbox_rir.test.id
                tenant_id: netbox_tenant.test.id
              dependencies:
                netbox_rir.test: |-
                    {
                      "name": "test-rir"
                    }
                netbox_tenant.test: |-
                    {
                      "name": "test-tenant"
                    }
        argumentDocs:
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            date_added: (String) Date the aggregate was added, as YYYY-MM-DD. Keeps its value when removed from the configuration.
            description: (String)
            family: '(Number) Address family: 4 or 6.'
            id: (Number) NetBox id.
            last_updated: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            prefix: (String) The aggregate in CIDR notation, e.g. 10.0.0.0/8.
            rir_id: (Number) Id of the RIR that allocated the aggregate.
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            tenant_id: (Number) Id of the tenant.
            url: (String)
        importStatements:
            - terraform import netbox_aggregate.test 123
    netbox_asn:
        subCategory: IP Address Management (IPAM)
        description: 'An autonomous system number (ipam.asn). From the official documentation https://docs.netbox.dev/en/stable/features/ipam/#asn: ASN is short for Autonomous System Number. This identifier is used in the BGP protocol to identify which "autonomous system" a particular prefix is originating and transiting through.The AS number model within NetBox allows you to model some of this real-world relationship.'
        name: netbox_asn
        title: netbox_asn Resource - terraform-provider-netbox
        examples:
            - name: to_site
              manifest: |-
                {
                  "asn": 64512,
                  "description": "test-description",
                  "rir_id": "${netbox_rir.test.id}",
                  "role_id": "${netbox_ipam_role.test.id}",
                  "site_ids": [
                    "${netbox_site.test.id}"
                  ],
                  "tenant_id": "${netbox_tenant.test.id}"
                }
              references:
                rir_id: netbox_rir.test.id
                role_id: netbox_ipam_role.test.id
                site_ids: netbox_site.test.id
                tenant_id: netbox_tenant.test.id
              dependencies:
                netbox_ipam_role.test: |-
                    {
                      "name": "test-ipam-role"
                    }
                netbox_rir.test: |-
                    {
                      "name": "test-rir"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
                netbox_tenant.test: |-
                    {
                      "name": "test-tenant"
                    }
            - name: site_explicit_clear
              manifest: |-
                {
                  "asn": 64513,
                  "description": "test-description",
                  "rir_id": "${netbox_rir.test.id}",
                  "role_id": "${netbox_ipam_role.test.id}",
                  "site_ids": [],
                  "tenant_id": "${netbox_tenant.test.id}"
                }
              references:
                rir_id: netbox_rir.test.id
                role_id: netbox_ipam_role.test.id
                tenant_id: netbox_tenant.test.id
              dependencies:
                netbox_ipam_role.test: |-
                    {
                      "name": "test-ipam-role"
                    }
                netbox_rir.test: |-
                    {
                      "name": "test-rir"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
                netbox_tenant.test: |-
                    {
                      "name": "test-tenant"
                    }
            - name: no_site
              manifest: |-
                {
                  "asn": 64514,
                  "description": "test-description",
                  "rir_id": "${netbox_rir.test.id}",
                  "role_id": "${netbox_ipam_role.test.id}",
                  "tenant_id": "${netbox_tenant.test.id}"
                }
              references:
                rir_id: netbox_rir.test.id
                role_id: netbox_ipam_role.test.id
                tenant_id: netbox_tenant.test.id
              dependencies:
                netbox_ipam_role.test: |-
                    {
                      "name": "test-ipam-role"
                    }
                netbox_rir.test: |-
                    {
                      "name": "test-rir"
                    }
                netbox_site.test: |-
                    {
                      "name": "test-site"
                    }
                netbox_tenant.test: |-
                    {
                      "name": "test-tenant"
                    }
        argumentDocs:
            asn: (Number) AS number. Must be a whole number.
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            id: (Number) NetBox id.
            last_updated: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            provider_count: (Number) Number of providers using the ASN.
            rir_id: (Number) Id of the RIR the ASN belongs to.
            role_id: (Number) Id of the role (ipam.role).
            site_count: (Number) Number of sites using the ASN.
            site_ids: (Set of Number) Ids of sites the ASN is assigned to. When set, the ASN is assigned to exactly these sites, and an empty set removes it from all of them. When unset, the sites are left alone, so they can be declared on the sites instead (netbox_site asn_ids).
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            tenant_id: (Number) Id of the tenant.
            url: (String)
        importStatements:
            - terraform import netbox_asn.to_site 123
    netbox_asn_range:
        subCategory: IP Address Management (IPAM)
        description: 'A NetBox ASN range (ipam.asnrange): a contiguous block of AS numbers under one RIR. From the official documentation https://netboxlabs.com/docs/netbox/models/ipam/asnrange/: Ranges can be defined to group'
        name: netbox_asn_range
        title: netbox_asn_range Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "end": 64521,
                  "name": "test-asn-range",
                  "rir_id": "${netbox_rir.test.id}",
                  "slug": "test-asn-range",
                  "start": 64512
                }
              references:
                rir_id: netbox_rir.test.id
              dependencies:
                netbox_rir.test: |-
                    {
                      "name": "test-rir"
                    }
        argumentDocs:
            asn_count: (Number) Number of ASNs in the range.
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            end: (Number) Last AS number in the range. Must be a whole number.
            id: (Number) NetBox id.
            last_updated: (String)
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            rir_id: (Number) Id of the RIR the range is allocated by.
            slug: (String) URL-friendly unique shorthand; derived from name when not set.
            start: (Number) First AS number in the range. Must be a whole number.
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            tenant_id: (Number) Id of the tenant the range belongs to.
            url: (String)
        importStatements:
            - terraform import netbox_asn_range.test 123
    netbox_available_asn:
        subCategory: IP Address Management (IPAM)
        description: 'An autonomous system number (ipam.asn) allocated from the next free ASN of an ASN range. After creation it is an ordinary ASN; the range replaces the resource when changed. From the official documentation https://netboxlabs.com/docs/netbox/models/ipam/asn/: An Autonomous System Number (ASN) is a numeric identifier used in the Border Gateway Protocol (BGP) to identify which'
