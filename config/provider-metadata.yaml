    netbox_vrf:
        subCategory: IP Address Management (IPAM)
        description: 'A VRF (ipam.vrf). From the official documentation https://docs.netbox.dev/en/stable/features/ipam/#virtual-routing-and-forwarding-vrf: A VRF object in NetBox represents a virtual routing and forwarding (VRF) domain. Each VRF is essentially a separate routing table. VRFs are commonly used to isolate customers or organizations from one another within a network, or to route overlapping address space (e.g. multiple instances of the 10.0.0.0/8 space). Each VRF may be assigned to a specific tenant to aid in organizing the available IP space by customer or internal user.'
        name: netbox_vrf
        title: netbox_vrf Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "description": "test-description",
                  "export_target_ids": [
                    "${netbox_route_target.test_a.id}",
                    "${netbox_route_target.test_b.id}"
                  ],
                  "import_target_ids": [
                    "${netbox_route_target.test_a.id}"
                  ],
                  "name": "test-vrf",
                  "rd": "65000:1",
                  "tenant_id": "${netbox_tenant.test.id}"
                }
              references:
                export_target_ids: netbox_route_target.test_a.id
                import_target_ids: netbox_route_target.test_a.id
                tenant_id: netbox_tenant.test.id
              dependencies:
                netbox_route_target.test_a: |-
                    {
                      "name": "65000:1"
                    }
                netbox_route_target.test_b: |-
                    {
                      "name": "65000:2"
                    }
                netbox_tenant.test: |-
                    {
                      "name": "test-tenant"
                    }
        argumentDocs:
            comments: (String)
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            enforce_unique: (Boolean) Prevent duplicate prefixes/IP addresses within this VRF.
            export_target_ids: (Set of Number) Ids of exported route targets.
            id: (Number) NetBox id.
            import_target_ids: (Set of Number) Ids of imported route targets.
            ip_address_count: (Number) Number of IP addresses in the VRF.
            last_updated: (String)
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            prefix_count: (Number) Number of prefixes in the VRF.
            rd: (String) Route distinguisher (unique).
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
