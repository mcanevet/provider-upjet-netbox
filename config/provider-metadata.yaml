              manifest: |-
                {
                  "amperage": 32,
                  "description": "test-description",
                  "mark_connected": true,
                  "max_utilization_percent": 75,
                  "name": "test-power-feed",
                  "phase": "three-phase",
                  "power_panel_id": "${netbox_power_panel.test.id}",
                  "rack_id": "${netbox_rack.test.id}",
                  "status": "active",
                  "supply": "ac",
                  "type": "primary",
                  "voltage": 230
                }
              references:
                power_panel_id: netbox_power_panel.test.id
                rack_id: netbox_rack.test.id
