            - terraform import netbox_vrf.test 123
    netbox_webhook:
        subCategory: Extras
        description: 'A NetBox webhook (extras.webhook): an HTTP endpoint an event rule can call. From the official documentation https://docs.netbox.dev/en/stable/integrations/webhooks/: A webhook is a mechanism for conveying to some external system a change that took place in NetBox. For example, you may want to notify a monitoring system whenever the status of a device is updated in NetBox. This can be done by creating a webhook for the device model in NetBox and identifying the webhook receiver. When NetBox detects a change to a device, an HTTP request containing the details of the change and who made it be sent to the specified receiver.'
        name: netbox_webhook
        title: netbox_webhook Resource - terraform-provider-netbox
        examples:
            - name: test
              manifest: |-
                {
                  "additional_headers": "X-Test: test",
                  "body_template": "{{ event }}",
                  "description": "test-description",
                  "http_content_type": "application/json",
                  "http_method": "POST",
                  "name": "test-webhook",
                  "payload_url": "https://example.com/test",
                  "secret": "test-secret",
                  "ssl_verification": true
                }
        argumentDocs:
            additional_headers: '(String) Extra request headers, one Name: Value per line; may be a Jinja2 template.'
            body_template: (String) Jinja2 template for the request body.
            ca_file_path: (String) Path on the NetBox server to a CA certificate file to verify against. NetBox rejects it while ssl_verification is false.
            created: (String)
            custom_fields: (Map of String) Custom field values by field name. Every value is a string; NetBox coerces numbers and booleans. An object field holds the related object's id, e.g. "12", a multiobject field a JSON list of ids in any order, e.g. jsonencode([12, 13]). A key removed from the map is cleared in NetBox (set {} to clear all).
            description: (String)
            http_content_type: (String) Content-Type header.
            http_method: '(String) HTTP method. One of: GET, POST, PUT, PATCH, DELETE.'
            id: (Number) NetBox id.
            last_updated: (String)
            name: (String)
            owner_id: (Number) Id of the owner the object is assigned to.
            payload_url: (String) URL the request is sent to; may be a Jinja2 template.
            secret: (String, Sensitive) Secret used to sign the request in the X-Hook-Signature header.
            ssl_verification: (Boolean) Verify the endpoint's TLS certificate.
            tags: (Set of String) Slugs of the tags assigned to the object (the provider's default_tags are added on top, see tags_all).
            tags_all: (Set of String) Slugs of all tags on the object, including the provider's default_tags.
            url: (String)
