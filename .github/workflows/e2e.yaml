# Runs uptest against an ephemeral NetBox deployed inside the kind control
# plane (cluster/test/netbox.yaml). No cloud credentials or repository secrets
# are involved, so unlike the upjet-provider-template's comment-triggered
# (/test-examples) workflow this runs on every PR, including from forks.
name: End to End Testing

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch:
    inputs:
      examples:
        description: Comma-separated list of example files to test (default - all)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  uptest:
    name: uptest (NetBox ${{ matrix.netbox-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # v4.6.10: supported by terraform-provider-netbox v6.0.0.
        # v4.4.10: outside its supported range, but the version in production.
        netbox-version: [v4.6.10, v4.4.10]

    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          large-packages: false
          swap-storage: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: all

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Run Uptest
        env:
          UPTEST_TEST_DIR: ./_output/controlplane-dump
          UPTEST_UPDATE_PARAMETER: ""
          NETBOX_VERSION: ${{ matrix.netbox-version }}
          INPUT_EXAMPLES: ${{ inputs.examples }}
        run: |
          if [ -n "${INPUT_EXAMPLES}" ]; then export UPTEST_EXAMPLE_LIST="${INPUT_EXAMPLES}"; fi
          make e2e

      - name: Collect Cluster Dump
        if: always()
        run: |
          make controlplane.dump

      - name: Upload Cluster Dump
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlplane-dump-netbox-${{ matrix.netbox-version }}
          path: ./_output/controlplane-dump
