name: Publish Provider Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        default: ''
        required: false
      go-version:
        description: 'Go version to use if building needs to be done'
        default: '1.27'
        required: false

jobs:
  publish-provider-package:
    # The repository's default token is read-only; pushing the package to
    # GHCR needs packages: write.
    permissions:
      contents: read
      packages: write
    uses: crossplane-contrib/provider-workflows/.github/workflows/publish-provider.yml@d8bb2978c8987635b2fddb5bd9c2868bd14117b0 # main
    with:
      repository: provider-upjet-netbox
      version: ${{ github.event.inputs.version }}
      go-version: ${{ github.event.inputs.go-version }}
      cleanup-disk: true
      # ghcr.io/mcanevet, not the default crossplane-contrib org, and no
      # mirror to xpkg.upbound.io.
      registry_org: mcanevet
      mirror: false
    secrets:
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
