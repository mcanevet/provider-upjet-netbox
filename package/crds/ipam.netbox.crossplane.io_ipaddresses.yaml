          its subnet mask. Its mask should match exactly how the IP address is configured
          on an interface in the real world.Like a prefix, an IP address can optionally
          be assigned to a VRF (otherwise, it will appear in the "global" table).
          IP addresses are automatically arranged under parent prefixes within their
          respective VRFs according to the IP hierarchy.'
