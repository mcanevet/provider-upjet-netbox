apiVersion: ipam.netbox.crossplane.io/v1alpha1
kind: IPAddress
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/ipaddress
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    deviceInterfaceId: ${netbox_device_interface.test.id}
    dnsName: test-device.example.com
    ipAddress: 192.0.2.10/24
    status: active

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Device
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/ipaddress
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    deviceTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    name: test-device
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    siteIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: DeviceRole
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/ipaddress
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: test-device-role

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: DeviceType
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/ipaddress
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    manufacturerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    model: test-device-type

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Manufacturer
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/ipaddress
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: test-manufacturer

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Site
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/ipaddress
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: test-site
