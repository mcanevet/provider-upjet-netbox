apiVersion: ipam.netbox.crossplane.io/v1alpha1
kind: Prefix
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/prefix
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    description: test-description
    isPool: true
    markUtilized: false
    prefix: 192.0.2.0/24
    roleId: ${netbox_ipam_role.test.id}
    siteId: ${netbox_site.test.id}
    status: active
    tenantId: ${netbox_tenant.test.id}
    vlanId: ${netbox_vlan.test.id}
    vrfId: ${netbox_vrf.test.id}

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Site
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/prefix
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: test-site

---

apiVersion: tenancy.netbox.crossplane.io/v1alpha1
kind: Tenant
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/prefix
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: test-tenant

---

apiVersion: ipam.netbox.crossplane.io/v1alpha1
kind: VLAN
metadata:
  annotations:
    meta.upbound.io/example-id: ipam/v1alpha1/prefix
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: test-vlan
    vid: 100
