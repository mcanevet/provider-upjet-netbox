apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: ModuleBayTemplate
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/modulebaytemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    description: test-description
    deviceTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    label: test-label
    name: test-module-bay-template
    position: "1"

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: DeviceType
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/modulebaytemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    manufacturerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    model: test-device-type

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Manufacturer
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/modulebaytemplate
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: test-manufacturer
