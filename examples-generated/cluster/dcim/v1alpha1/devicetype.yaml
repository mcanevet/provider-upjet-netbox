apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: DeviceType
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/devicetype
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    airflow: front-to-rear
    description: test-description
    isFullDepth: false
    manufacturerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    model: test-device-type
    partNumber: test-part-number
    slug: test-device-type
    uHeight: 1
    weight: 12.5
    weightUnit: kg

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Manufacturer
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/devicetype
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    name: test-manufacturer
