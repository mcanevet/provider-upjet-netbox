apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: DeviceInterface
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/deviceinterface
  labels:
    testing.upbound.io/example-name: test_lag
  name: test-lag
spec:
  forProvider:
    deviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    name: test-lag
    type: lag

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
kind: Device
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/deviceinterface
  labels:
    testing.upbound.io/example-name: test
  name: test
spec:
  forProvider:
    deviceTypeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    name: test-device
    roleIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    siteIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test

---

apiVersion: dcim.netbox.crossplane.io/v1alpha1
