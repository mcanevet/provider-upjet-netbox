apiVersion: dcim.netbox.m.crossplane.io/v1alpha1
kind: ModuleType
metadata:
  annotations:
    meta.upbound.io/example-id: dcim/v1alpha1/moduletype
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    description: test-description
    manufacturerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    model: test-module-type
    partNumber: test-part-number
    weight: 1.2
    weightUnit: kg

