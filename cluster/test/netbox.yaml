# Ephemeral NetBox for e2e tests, deployed into the kind control plane.
#
# Mirrors docker/docker-compose.yml of e-breuninger/terraform-provider-netbox
# v6.0.0, which is what that provider's own acceptance tests run against. All
# credentials below are throwaway test values (the same ones published in that
# upstream file); nothing here is a secret.
#
# The NetBox image tag is substituted by `make netbox.deploy` (NETBOX_VERSION).
#
# Every pod sets enableServiceLinks: false. Otherwise Kubernetes injects
# Docker-link-style variables for each Service in the namespace, e.g.
# REDIS_PORT=tcp://10.96.x.y:6379 for the "redis" Service, and the NetBox
# image reads REDIS_PORT as its own setting and crashes on int("tcp://...").
---
apiVersion: v1
kind: Namespace
metadata:
  name: netbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: netbox
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          args: ["-c", "max_connections=300"]
          env:
            - {name: POSTGRES_USER, value: netbox}
            - {name: POSTGRES_PASSWORD, value: netbox}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-t", "2", "-U", "netbox"]
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: netbox
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: netbox
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      enableServiceLinks: false
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.0-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli ping | grep -q PONG"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: netbox
spec:
  selector: {app: redis}
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox
  namespace: netbox
spec:
  replicas: 1
  # NetBox's first start runs every migration, which can outlast the default
  # 600s progress deadline on CI runners; `rollout status` would then fail
  # before the startupProbe's own budget is spent.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels: {app: netbox}
  template:
    metadata:
      labels: {app: netbox}
    spec:
      enableServiceLinks: false
      containers:
        - name: netbox
          image: netboxcommunity/netbox:NETBOX_VERSION
          env:
            - {name: DB_HOST, value: postgres}
            - {name: DB_USER, value: netbox}
            - {name: DB_PASSWORD, value: netbox}
            - {name: REDIS_HOST, value: redis}
            - {name: SECRET_KEY, value: "0123456789abcdefghij0123456789abcdefghij0123456789"}
            - {name: SUPERUSER_PASSWORD, value: admin}
            # Together these yield the v2 API token
            # nbt_mrcLJrER9ves.Iw2JZtpMdYjBuIVIZLItd4lB2RYEiv6xhY23W0tQ
            # (NetBox creates no token without a pepper).
            - {name: SUPERUSER_API_TOKEN, value: Iw2JZtpMdYjBuIVIZLItd4lB2RYEiv6xhY23W0tQ}
            - {name: SUPERUSER_API_KEY, value: mrcLJrER9ves}
            - {name: API_TOKEN_PEPPER_1, value: C9Bp3tmBgchWcWc2OkoFuaV9aoKZfhJgZUBG7g0PFxYzf1AkLd}
          ports:
            - containerPort: 8080
          # /login/ only serves 200 once migrations have run and the app is up.
          readinessProbe:
            httpGet:
              path: /login/
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /login/
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            # Migrations on a cold CI runner can take several minutes.
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: netbox
  namespace: netbox
spec:
  selector: {app: netbox}
  ports:
    - port: 8080
